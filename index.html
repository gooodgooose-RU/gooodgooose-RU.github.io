<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Kahoot Style</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,Arial,sans-serif}
  body{background:#26223e;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .screen{display:none;width:100%;max-width:900px;padding:20px}
  .screen.active{display:block}

  /* Welcome */
  .welcome-card{text-align:center}
  .welcome-card h1{font-size:2.8rem;margin-bottom:10px;color:#fff;letter-spacing:1px}
  .welcome-card p{font-size:1.1rem;color:#ccc;margin-bottom:40px}
  .cat-grid{display:flex;flex-direction:column;gap:20px;max-width:480px;margin:0 auto}
  .cat-btn{padding:22px;border:none;border-radius:16px;font-size:1.4rem;font-weight:700;color:#fff;cursor:pointer;transition:transform .15s,filter .15s}
  .cat-btn:hover{transform:translateY(-4px);filter:brightness(1.15)}
  .cat-btn:active{transform:translateY(2px)}
  .cat-kids{background:linear-gradient(135deg,#ff5a5f,#e63946)}
  .cat-teens{background:linear-gradient(135deg,#33c4ff,#1a73e8)}
  .cat-pro{background:linear-gradient(135deg,#56f0a1,#22a06b)}

  /* Quiz */
  .quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  .question-num{font-size:1.3rem;font-weight:700}
  .timer-wrap{display:flex;align-items:center;gap:10px}
  .timer-bar-bg{width:120px;height:14px;background:#3d3658;border-radius:7px;overflow:hidden}
  .timer-bar-fill{height:100%;border-radius:7px;background:#56f0a1;transition:width 1s linear;width:100%}
  .timer-text{font-size:1.2rem;font-weight:700;min-width:36px;text-align:right}
  .question-text{font-size:2rem;font-weight:700;text-align:center;margin:48px 0}
  .answers-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .ans-btn{padding:28px 20px;border:none;border-radius:16px;font-size:1.25rem;font-weight:700;color:#fff;cursor:pointer;transition:transform .12s,filter .15s;text-align:left}
  .ans-btn:hover{transform:translateY(-4px);filter:brightness(1.12)}
  .ans-btn:active{transform:translateY(2px)}
  .ans-btn.disabled{pointer-events:none}
  .ans-btn.correct{outline:4px solid #fff}
  .ans-btn.wrong{outline:4px solid #333;opacity:.6}
  .ans-0{background:linear-gradient(135deg,#ff5a5f,#e63946)}
  .ans-1{background:linear-gradient(135deg,#33c4ff,#1a73e8)}
  .ans-2{background:linear-gradient(135deg,#ffba3d,#f59000)}
  .ans-3{background:linear-gradient(135deg,#56f0a1,#22a06b)}

  /* Finish */
  .finish-card{text-align:center}
  .finish-card h1{font-size:2.4rem;margin-bottom:16px}
  .score-display{font-size:3.5rem;font-weight:800;margin:20px 0;color:#56f0a1}
  .grade-display{font-size:2rem;font-weight:700;margin-bottom:12px;color:#ffba3d}
  .comment{font-size:1.15rem;color:#ccc;margin-bottom:40px;max-width:500px;margin-left:auto;margin-right:auto}
  .restart-btn{padding:18px 48px;border:none;border-radius:14px;font-size:1.3rem;font-weight:700;color:#fff;background:linear-gradient(135deg,#a259ff,#7b2fe6);cursor:pointer;transition:transform .15s,filter .15s}
  .restart-btn:hover{transform:translateY(-4px);filter:brightness(1.15)}
  .restart-btn:active{transform:translateY(2px)}
</style>
</head>
<body>

<!-- Hidden YouTube player container -->
<div id="player" style="display:none;"></div>

<!-- Screen 1: Welcome -->
<div class="screen active" id="screen-welcome">
  <div class="welcome-card">
    <h1>🎯 Викторина</h1>
    <p>Выберите свою категорию и проверьте эрудицию!</p>
    <div class="cat-grid">
      <button class="cat-btn cat-kids" onclick="startQuiz('kids')">Дети (7–10 лет)</button>
      <button class="cat-btn cat-teens" onclick="startQuiz('teens')">Подростки (11–15 лет)</button>
      <button class="cat-btn cat-pro" onclick="startQuiz('pro')">Профи (16+ лет)</button>
    </div>
  </div>
</div>

<!-- Screen 2: Quiz -->
<div class="screen" id="screen-quiz">
  <div class="quiz-header">
    <div class="question-num" id="qNum">Вопрос: 1/10</div>
    <div class="timer-wrap">
      <div class="timer-bar-bg"><div class="timer-bar-fill" id="timerBar"></div></div>
      <div class="timer-text" id="timerText">20</div>
    </div>
  </div>
  <div class="question-text" id="qText">Вопрос</div>
  <div class="answers-grid" id="answersGrid"></div>
</div>

<!-- Screen 3: Finish -->
<div class="screen" id="screen-finish">
  <div class="finish-card">
    <h1>Результаты 🎉</h1>
    <div class="score-display" id="scoreDisplay">0 / 10</div>
    <div class="grade-display" id="gradeDisplay">Оценка: 5</div>
    <p class="comment" id="commentText"></p>
    <button class="restart-btn" onclick="restart()">Играть снова</button>
  </div>
</div>

<script>
var questions = {
  kids: [
    {q:"Сколько лап у кошки?", a:["2","4","6","8"], c:1},
    {q:"Какого цвета небо в ясный день?", a:["Зелёное","Синее","Красное","Чёрное"], c:1},
    {q:"Сколько дней в неделе?", a:["5","6","7","8"], c:2},
    {q:"Какое животное говорит «Му»?", a:["Собака","Корова","Лошадь","Курица"], c:1},
    {q:"Какой праздник приносит Дед Мороз?", a:["Лето","Новый год","День рождения","8 Марта"], c:1},
    {q:"Сколько цветов у радуги?", a:["5","6","7","8"], c:2},
    {q:"Что делает пчела?", a:["Мёд","Молоко","Хлеб","Сметану"], c:0},
    {q:"Какая цифра идёт после пяти?", a:["Четыре","Шесть","Семь","Восемь"], c:1},
    {q:"Где живёт рыба?", a:["В лесу","В воде","В небе","В норе"], c:1},
    {q:"Какой формы мяч?", a:["Квадратный","Круглый","Треугольный","Овальный"], c:1}
  ],
  teens: [
    {q:"Столица Австралии?", a:["Сидней","Канберра","Мельбурн","Перт"], c:1},
    {q:"Сколько материков на Земле?", a:["5","6","7","8"], c:1},
    {q:"Кто написал «Войну и мир»?", a:["Достоевский","Толстой","Чехов","Пушкин"], c:1},
    {q:"Что изучает астрономия?", a:["Растения","Звёзды","Насекомых","Камни"], c:1},
    {q:"Сколько игроков в футбольной команде?", a:["9","10","11","12"], c:2},
    {q:"Какой металл жидкий при комнатной температуре?", a:["Свинец","Ртуть","Олово","Цинк"], c:1},
    {q:"Кто нарисовал «Мону Лизу»?", a:["Микеланджело","Рафаэль","Да Винчи","Ван Гог"], c:2},
    {q:"Самая длинная река в мире?", a:["Волга","Амазонка","Нил","Ганг"], c:2},
    {q:"В каком году распался СССР?", a:["1989","1990","1991","1992"], c:2},
    {q:"Какая планета ближе всего к Солнцу?", a:["Венера","Меркурий","Земля","Марс"], c:1}
  ],
  pro: [
    {q:"Кто сформулировал теорию относительности?", a:["Ньютон","Эйнштейн","Бор","Резерфорд"], c:1},
    {q:"Какое самое глубокое озеро в мире?", a:["Каспийское","Байкал","Танганьика","Виктория"], c:1},
    {q:"В каком году началась Столетняя война?", a:["1337","1415","1206","1453"], c:0},
    {q:"Что такое HTML?", a:["Язык программирования","Язык разметки","База данных","Протокол"], c:1},
    {q:"Кто написал «Преступление и наказание»?", a:["Толстой","Гоголь","Достоевский","Тургенев"], c:2},
    {q:"Какое число называется числом Эйлера (e)?", a:["2{,}718","3{,}14","1{,}618","0{,}577"], c:0},
    {q:"Какая страна родина футбола?", a:["Бразилия","Италия","Англия","Германия"], c:2},
    {q:"Кто изобрёл телефон?", a:["Эдисон","Белл","Маркони","Тесла"], c:1},
    {q:"Какой элемент имеет химический символ Au?", a:["Серебро","Золото","Алюминий","Медь"], c:1},
    {q:"Какой самый маленький угол в равностороннем треугольнике?", a:["30°","45°","60°","90°"], c:2}
  ]
};

var currentCat = 'kids';
var currentQ = 0;
var score = 0;
var timeLeft = 20;
var timerId = null;
var answered = false;

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function startQuiz(cat) {
  // Запускаем музыку строго по клику пользователя
  if (player && typeof player.playVideo === 'function') {
    player.unMute();   // снимаем беззвучный режим на всякий случай
    player.playVideo(); // запускаем воспроизведение
  }

  currentCat = cat;
  currentQ = 0;
  score = 0;
  showScreen('screen-quiz');
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  var pool = questions[currentCat];
  var item = pool[currentQ];

  document.getElementById('qNum').textContent = 'Вопрос: ' + (currentQ + 1) + '/' + pool.length;
  document.getElementById('qText').textContent = item.q;

  var grid = document.getElementById('answersGrid');
  grid.innerHTML = '';
  for (var i = 0; i < 4; i++) {
    var btn = document.createElement('button');
    btn.className = 'ans-btn ans-' + i;
    btn.textContent = item.a[i];
    btn.setAttribute('onclick', 'answer(' + i + ')');
    grid.appendChild(btn);
  }

  timeLeft = 20;
  document.getElementById('timerText').textContent = timeLeft;
  var bar = document.getElementById('timerBar');
  bar.style.width = '100%';
  bar.style.background = '#56f0a1';
  bar.style.transition = 'none';
  bar.offsetHeight;
  bar.style.transition = 'width 1s linear';

  if (timerId) clearInterval(timerId);
  timerId = setInterval(tick, 1000);
}

function tick() {
  timeLeft--;
  document.getElementById('timerText').textContent = timeLeft;
  var pct = (timeLeft / 20) * 100;
  var bar = document.getElementById('timerBar');
  bar.style.width = pct + '%';
  if (timeLeft <= 5) bar.style.background = '#ff5a5f';

  if (timeLeft <= 0) {
    clearInterval(timerId);
    answer(-1);
  }
}

function answer(idx) {
  if (answered) return;
  answered = true;
  clearInterval(timerId);

  var pool = questions[currentCat];
  var item = pool[currentQ];
  var buttons = document.querySelectorAll('.ans-btn');

  buttons.forEach(function(b){ b.classList.add('disabled'); });

  if (idx === item.c) {
    score++;
    buttons[idx].classList.add('correct');
  } else {
    if (idx >= 0) buttons[idx].classList.add('wrong');
    if (item.c >= 0) buttons[item.c].classList.add('correct');
  }

  currentQ++;
  if (currentQ >= pool.length) {
    setTimeout(finishQuiz, 1500);
  } else {
    setTimeout(loadQuestion, 1500);
  }
}

function finishQuiz() {
  showScreen('screen-finish');

  // Останавливаем музыку на финальном экране
  if (player && typeof player.stopVideo === 'function') {
    player.stopVideo();
  }

  var pool = questions[currentCat];
  var total = pool.length;
  document.getElementById('scoreDisplay').textContent = score + ' / ' + total;

  var grade, comment;
  if (score === total) { grade = '5+'; comment = 'Идеально! Ты настоящий эрудит! 🌟'; }
  else if (score >= 8) { grade = '5'; comment = 'Отличный результат! Почти безупречно!'; }
  else if (score >= 6) { grade = '4'; comment = 'Хорошо! Знания на твёрдую четвёрку.'; }
  else if (score >= 4) { grade = '3'; comment = 'Неплохо, но есть куда расти. Попробуй ещё!'; }
  else { grade = '2'; comment = 'Не сдавайся! В следующий раз точно получится.'; }

  document.getElementById('gradeDisplay').textContent = 'Оценка: ' + grade;
  document.getElementById('commentText').textContent = comment;
}

function restart() {
  if (timerId) clearInterval(timerId);
  showScreen('screen-welcome');
}

window.onload = function() {
  showScreen('screen-welcome');
};
</script>

<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
var player;
function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    height: '0',
    width: '0',
    videoId: 'b_fLp7hI4C8',
    playerVars: {
      'autoplay': 0,
      'loop': 1,
      'playlist': 'b_fLp7hI4C8',
      'controls': 0
    }
  });
}
</script>

</body>
</html>
